<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Tree Picker</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2024; --muted: #6b7280;
    --line: #e5e7eb; --accent: #4f46e5; --accent-soft: #eef2ff;
    --cpt: #15803d; --cpt-bg: #e9f7ee;   /* competent = green check */
    --int: #6d28d9; --int-bg: #f1ebfe;   /* interest  = school cap  */
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background: var(--bg); display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 18px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .brand small { display:block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .grow { flex: 1 1 auto; }
  label.name { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  #who {
    width: 220px; padding: 7px 11px; font-size: 13px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; outline: none; background: var(--bg);
  }
  #who:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }
  .stats { display: flex; gap: 6px; }
  .pill { background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
          padding: 3px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .pill b { color: var(--ink); }
  .pill.c b { color: var(--cpt); } .pill.i b { color: var(--int); }
  button {
    font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.05); }
  button.ghost { background: transparent; color: var(--muted); }

  .toolbar { display: flex; align-items: center; gap: 14px; padding: 8px 18px;
             background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  #search { width: 320px; max-width: 50vw; padding: 7px 11px; font-size: 13px;
            border: 1px solid var(--line); border-radius: 8px; outline: none; background: var(--bg); }
  #search:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }

  main { flex: 1 1 auto; overflow-y: auto; padding: 10px 0 60px; }
  ul.tree, ul.kids { list-style: none; margin: 0; padding: 0; }
  ul.kids { display: none; padding-left: 20px; }
  li.open > ul.kids { display: block; }

  .row { display: flex; align-items: center; gap: 8px; padding: 4px 18px 4px 0;
         border-bottom: 1px solid #f4f5f7; }
  .row:hover { background: #fafafe; }
  .row.hit { background: #fffbeb; }
  .tw { width: 18px; flex: none; text-align: center; color: var(--muted); cursor: pointer;
        user-select: none; font-size: 11px; transition: transform .12s; }
  li.leaf > .row .tw { visibility: hidden; }
  li.open > .row .tw { transform: rotate(90deg); }
  .nm { flex: 1 1 auto; min-width: 0; cursor: pointer; }
  .nm .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block;
           max-width: 100%; vertical-align: bottom; }
  .nm code { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 7px; }
  .lv-domain    .t { font-weight: 700; }
  .lv-subdomain .t { font-weight: 600; }
  .lv-skill     .t { font-weight: 400; }
  .badge { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 999px; flex: none;
           text-transform: capitalize; color: var(--muted); background: var(--bg); border: 1px solid var(--line); }

  /* compact two-icon picker: ✅ competent · 🎓 interest (off = neither) */
  .pick { display: inline-flex; flex: none; gap: 4px; }
  .pk { width: 26px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 6px;
        background: var(--panel); cursor: pointer; font-size: 13px; line-height: 1;
        display: inline-flex; align-items: center; justify-content: center;
        filter: grayscale(1); opacity: .4; transition: opacity .1s; }
  .pk:hover { opacity: .85; }
  .pk.on { filter: none; opacity: 1; }
  .pk-c.on { background: var(--cpt-bg); border-color: var(--cpt); }
  .pk-i.on { background: var(--int-bg); border-color: var(--int); }

  /* tint a row that (or whose descendants) carries a selection */
  li[data-mark="competent"] > .row > .nm .t { color: var(--cpt); }
  li[data-mark="interest"]  > .row > .nm .t { color: var(--int); }
  .dot.none { background: transparent; }

  .empty { color: var(--muted); padding: 40px 26px; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
           border-top: 1px solid var(--line); padding: 6px 18px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="brand">Skill Tree Picker<small>tag each item: competent or interest</small></div>
  <label class="name">Name <input id="who" type="text" placeholder="your name" autocomplete="name"></label>
  <div class="stats" id="stats"></div>
  <div class="grow"></div>
  <button class="ghost" id="expandAll">Expand all</button>
  <button class="ghost" id="collapseAll">Collapse all</button>
  <button class="ghost" id="clearAll">Clear</button>
  <button class="primary" id="export">Export JSON ▾</button>
</header>
<div class="toolbar">
  <input id="search" type="search" placeholder="Filter by name or id…  ( / )" autocomplete="off">
  <span class="pill" id="searchInfo"></span>
</div>
<main><ul class="tree" id="tree"></ul></main>
<footer>Selections autosave in this browser. ✅ <b>Competent</b> = you can already do it · 🎓 <b>Interest</b> = you want to learn it.</footer>

// ---- flatten into a node model: {id,name,kind,desc,children:[ids]} ----
const NODE = new Map();          // id -> node
const KIND = { domain: 'domain', subdomain: 'subdomain', skill: 'skill' };
for (const d of TREE.domains) {
  const dKids = [];
  for (const s of d.subdomains || []) {
    const sKids = [];
    for (const k of s.skills || []) {
      NODE.set(k.id, { id: k.id, name: k.name, kind: 'skill', level: k.level || '', children: [] });
      sKids.push(k.id);
    }
    NODE.set(s.id, { id: s.id, name: s.name, kind: 'subdomain', children: sKids });
    dKids.push(s.id);
  }
  NODE.set(d.id, { id: d.id, name: d.name, kind: 'domain', children: dKids });
}
const ROOTS = TREE.domains.map(d => d.id);

// ---- state: id -> 'competent' | 'interest'  (absent = none) ----
const KEY = 'skilltree.picker.v1';
let state = new Map();
let who = '';
(function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
    who = raw.name || '';
    for (const [id, st] of Object.entries(raw.state || {}))
      if (NODE.has(id)) state.set(id, st === 'component' ? 'competent' : st);  // migrate old label
  } catch {}
})();
function save() {
  localStorage.setItem(KEY, JSON.stringify({ name: who, state: Object.fromEntries(state) }));
}

// ---- rendering (children lazy-built on first expand) ----
const treeEl = document.getElementById('tree');
const LI = new Map();            // id -> <li> (only for built rows)

function makeRow(id) {
  const n = NODE.get(id);
  const li = document.createElement('li');
  li.dataset.id = id;
  li.className = n.children.length ? 'branch' : 'leaf';
  li.dataset.kind = n.kind;

  const row = document.createElement('div');
  row.className = 'row lv-' + n.kind;

  const tw = document.createElement('span');
  tw.className = 'tw'; tw.textContent = '▶'; tw.dataset.toggle = '1';
  row.appendChild(tw);

  const cur = state.get(id);
  const pk = document.createElement('span');
  pk.className = 'pick';
  pk.innerHTML =
    `<button type="button" class="pk pk-c${cur === 'competent' ? ' on' : ''}" data-set="competent" title="Competent — I can already do this">✅</button>` +
    `<button type="button" class="pk pk-i${cur === 'interest' ? ' on' : ''}" data-set="interest" title="Interest — I want to learn this">🎓</button>`;
  row.appendChild(pk);

  const nm = document.createElement('span');
  nm.className = 'nm'; nm.dataset.toggle = '1';
  nm.innerHTML = `<span class="t">${esc(n.name)}</span><code>${esc(id)}</code>`;
  row.appendChild(nm);

  if (n.kind === 'skill' && n.level) {
    const b = document.createElement('span'); b.className = 'badge'; b.textContent = n.level;
    row.appendChild(b);
  }

  li.appendChild(row);
  if (n.children.length) {
    const ul = document.createElement('ul'); ul.className = 'kids'; ul.dataset.built = '0';
    li.appendChild(ul);
  }
  LI.set(id, li);
  syncRow(id);
  return li;
}

function buildChildren(li) {
  const ul = li.querySelector(':scope > ul.kids');
  if (!ul || ul.dataset.built === '1') return;
  const frag = document.createDocumentFragment();
  for (const cid of NODE.get(li.dataset.id).children) frag.appendChild(makeRow(cid));
  ul.appendChild(frag);
  ul.dataset.built = '1';
}

function setOpen(li, open) {
  if (!li.classList.contains('branch')) return;
  if (open) buildChildren(li);
  li.classList.toggle('open', open);
}

// reflect a node's state into its row: name tint + which icon is lit
function syncRow(id) {
  const li = LI.get(id); if (!li) return;
  const own = state.get(id);
  if (own) li.dataset.mark = own; else delete li.dataset.mark;
  const c = li.querySelector(':scope > .row .pk-c');
  const i = li.querySelector(':scope > .row .pk-i');
  if (c) c.classList.toggle('on', own === 'competent');
  if (i) i.classList.toggle('on', own === 'interest');
}

// ---- counts ----
const statsEl = document.getElementById('stats');
function recount() {
  let c = 0, i = 0;
  for (const v of state.values()) { if (v === 'competent') c++; else if (v === 'interest') i++; }
  statsEl.innerHTML =
    `<span class="pill c">competent <b>${c}</b></span><span class="pill i">interest <b>${i}</b></span>`;
}

// ---- events (delegated) ----
treeEl.addEventListener('click', (e) => {
  const pk = e.target.closest('.pk');
  if (pk) {                                // toggle competent/interest (click again = none)
    const id = e.target.closest('li').dataset.id, set = pk.dataset.set;
    if (state.get(id) === set) state.delete(id); else state.set(id, set);
    syncRow(id); recount(); save();
    return;
  }
  const t = e.target.closest('[data-toggle]');
  if (!t) return;
  const li = e.target.closest('li');
  setOpen(li, !li.classList.contains('open'));
});

// ---- bulk actions ----
function expandAll() {
  const walk = (li) => { setOpen(li, true);
    li.querySelectorAll(':scope > ul.kids > li.branch').forEach(walk); };
  treeEl.querySelectorAll(':scope > li.branch').forEach(walk);
}
function collapseAll() { treeEl.querySelectorAll('li.open').forEach(li => li.classList.remove('open')); }
document.getElementById('expandAll').onclick = expandAll;
document.getElementById('collapseAll').onclick = collapseAll;
document.getElementById('clearAll').onclick = () => {
  if (!state.size || !confirm('Clear all selections?')) return;
  const ids = [...state.keys()]; state.clear();
  ids.forEach(syncRow);
  recount(); save();
};

// ---- name ----
const whoEl = document.getElementById('who');
whoEl.value = who;
whoEl.addEventListener('input', () => { who = whoEl.value; save(); });

// ---- search / filter ----
const searchEl = document.getElementById('search');
const searchInfo = document.getElementById('searchInfo');
let hits = [];
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  treeEl.querySelectorAll('.row.hit').forEach(r => r.classList.remove('hit'));
  if (!q) { searchInfo.textContent = ''; return; }
  hits = [...NODE.values()].filter(n =>
    n.name.toLowerCase().includes(q) || n.id.toLowerCase().includes(q));
  searchInfo.textContent = `${hits.length} match${hits.length === 1 ? '' : 'es'}`;
  // reveal each hit by opening its ancestor chain, then highlight
  for (const n of hits.slice(0, 400)) revealPath(n.id);
  for (const n of hits.slice(0, 400)) {
    const li = LI.get(n.id); if (li) li.querySelector(':scope > .row').classList.add('hit');
  }
  const first = hits[0] && LI.get(hits[0].id);
  if (first) first.scrollIntoView({ block: 'center' });
});
function parentOf(id) {                     // derive from id structure
  const p = id.split('.'); p.pop();
  return p.length ? p.join('.') : null;
}
function revealPath(id) {
  const chain = []; let cur = parentOf(id);
  while (cur) { chain.unshift(cur); cur = parentOf(cur); }
  for (const aid of chain) { const li = LI.get(aid); if (li) setOpen(li, true); }
}
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchEl && document.activeElement !== whoEl) {
    e.preventDefault(); searchEl.focus();
  }
});

// ---- export ----
document.getElementById('export').onclick = () => {
  const pick = (st) => [...state.entries()].filter(([, v]) => v === st)
    .map(([id]) => ({ id, name: NODE.get(id).name, kind: NODE.get(id).kind }))
    .sort((a, b) => a.id.localeCompare(b.id));
  const out = {
    name: who || null,
    generatedAt: new Date().toISOString(),
    counts: { competent: pick('competent').length, interest: pick('interest').length },
    competent: pick('competent'),
    interest: pick('interest'),
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const slug = (who || 'skilltree').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'skilltree';
  a.href = URL.createObjectURL(blob);
  a.download = `skilltree-${slug}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---- initial render: domains only (lazy children) ----
const frag = document.createDocumentFragment();
for (const id of ROOTS) frag.appendChild(makeRow(id));
treeEl.appendChild(frag);
recount();
</script>
</body>
</html>
